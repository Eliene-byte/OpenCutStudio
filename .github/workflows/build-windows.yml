name: Build Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.2
          arch: win64_mingw
      - name: Instalar FFmpeg (portable)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $exe = Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $probe = Get-ChildItem ffmpeg-dl -Recurse -Filter ffprobe.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName dist/
          Copy-Item $probe.FullName dist/
      - name: Configurar + Compilar (MinGW)
        shell: pwsh
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          Copy-Item build/bin/OpenCutStudio.exe dist/
          $windeploy = Get-ChildItem -Path $env:QT_ROOT_DIR, $env:Qt6_DIR, "${{ github.workspace }}" -Recurse -Filter windeployqt.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $windeploy) { $windeploy = Get-Command windeployqt.exe -ErrorAction SilentlyContinue }
          if (-not $windeploy) { Get-ChildItem -Path "C:/Qt" -Recurse -Filter windeployqt.exe -ErrorAction SilentlyContinue | Select-Object -First 1 | ForEach-Object { $windeploy = $_ } }
          Write-Host "windeployqt: $($windeploy.Source ?? $windeploy.FullName)"
          & ($windeploy.Source ?? $windeploy.FullName) dist/OpenCutStudio.exe --release --no-translations --compiler-runtime
          # ---- Pacote 100% portatil: fonte + qt.conf + launcher + leia-me ----
          New-Item -ItemType Directory -Force -Path dist/fonts | Out-Null
          Invoke-WebRequest -Uri https://github.com/dejavu-fonts/dejavu-fonts/raw/version_2_37/ttf/DejaVuSans.ttf -OutFile dist/fonts/DejaVuSans.ttf
          Copy-Item assets/qt.conf dist/qt.conf
          Copy-Item assets/Abrir-OpenCut.bat dist/Abrir-OpenCut.bat
          Copy-Item assets/LEIAME-PORTATIL.txt dist/LEIAME-PORTATIL.txt
          # Remove dep de VC++: confirma runtime MinGW junto
          Write-Host "=== runtime ==="; Get-ChildItem dist/*.dll | Format-Table Name, Length
      - name: Verificação (sem abrir GUI — runner é headless)
        shell: pwsh
        run: |
          Write-Host "=== dist ==="; Get-ChildItem dist | Format-Table Name, Length
          Write-Host "=== fonts ==="; Get-ChildItem dist/fonts
          foreach ($need in @("dist/OpenCutStudio.exe","dist/ffmpeg.exe","dist/ffprobe.exe","dist/platforms/qwindows.dll","dist/Qt6Core.dll","dist/Qt6Widgets.dll","dist/fonts/DejaVuSans.ttf","dist/qt.conf","dist/Abrir-OpenCut.bat","dist/LEIAME-PORTATIL.txt")) {
            if (-not (Test-Path $need)) { Write-Error "FALTANDO: $need"; exit 1 }
          }
          Write-Host "Portatil OK: exe + Qt + ffmpeg + fonte + launcher."
      - name: Zip portable
        shell: pwsh
        run: Compress-Archive dist/* OpenCutStudio-windows-x64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCutStudio-windows-x64
          path: OpenCutStudio-windows-x64.zip
      - name: Release automática (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenCutStudio-windows-x64.zip
          generate_release_notes: true
